services:
  - type: web
    name: assis-xavier-whatsapp-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: TWILIO_PHONE
        value: whatsapp:+14155238886
      - key: ESCRITORIO_PHONE
        value: "+55 (44)99977-8551"
      # As 3 variáveis abaixo precisam ser preenchidas manualmente no painel do Render
      - key: CLAUDE_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
