services:
  - type: web
    name: assis-xavier-whatsapp-bot
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ESCRITORIO_PHONE
        value: "+55 (44)99977-8551"
      - key: VERIFY_TOKEN
        value: assis-xavier-verify-token
      # Preencher manualmente no painel do Render
      - key: CLAUDE_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      # Chave secreta do app na Meta: valida a assinatura (X-Hub-Signature-256) do /webhook
      - key: APP_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: LEAD_TEMPLATE_NAME
        sync: false
      - key: TEMPLATE_LANG
        value: pt_BR
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: TRANSCRIBE_API_KEY
        sync: false
      # Recado de voz da Ana (ElevenLabs). Fica desligado ate VOICE_REPLIES_ENABLED virar "true".
      - key: VOICE_REPLIES_ENABLED
        value: "false"
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: n2a9VtkZLl8j1FSXHsL7
      - key: ELEVENLABS_MODEL
        value: eleven_multilingual_v2
      - key: VOICE_MAX_CHARS
        value: "600"
      - key: VOICE_CLIENT_DAILY_LIMIT
        value: "6"
      - key: VOICE_DAILY_CHAR_LIMIT
        value: "2500"
