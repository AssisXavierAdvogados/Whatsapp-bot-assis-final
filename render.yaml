services:
  - type: web
    name: assis-xavier-whatsapp-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ESCRITORIO_PHONE
        value: "+55 (44)99977-8551"
      - key: VERIFY_TOKEN
        value: assis-xavier-verify-token
      # Preencher manualmente no painel do Render
      - key: CLAUDE_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_PASS
        sync: false
      - key: LEAD_TEMPLATE_NAME
        sync: false
      - key: TEMPLATE_LANG
        value: pt_BR
